<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>My Calendar</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#15161a;--muted:#777b86;--accent:#5b5ce2;--line:#e8e8ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;color:var(--text)}
body.dark{--bg:#101116;--card:#1b1c22;--text:#f5f5f7;--muted:#a5a7b0;--line:#30313a}
.app{max-width:560px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 2px 10px}
h1{font-size:29px;margin:0}.icon{border:0;background:var(--card);color:var(--text);width:42px;height:42px;border-radius:14px;font-size:20px}
.month{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}.month button{border:0;background:transparent;color:var(--text);font-size:26px}
.month strong{font-size:20px}.card{background:var(--card);border-radius:24px;padding:15px}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:5px 0}
.day{min-height:46px;border:0;background:transparent;color:var(--text);border-radius:14px;font-size:15px}.day.sel{background:var(--accent);color:white;font-weight:800}.dot{display:block;width:5px;height:5px;background:var(--accent);border-radius:50%;margin:3px auto 0}.sel .dot{background:white}
.selected{display:flex;align-items:center;justify-content:space-between;margin:23px 2px 10px}.selected h2{font-size:20px;margin:0}.add{border:0;background:var(--accent);color:white;padding:12px 16px;border-radius:15px;font-weight:700}
.event{display:flex;align-items:center;gap:12px;background:var(--card);padding:14px;border-radius:18px;margin:9px 0}.event .circle{width:38px;height:38px;border-radius:13px;background:#eeeefc;display:grid;place-items:center}.event main{flex:1}.event b{display:block}.event small{color:var(--muted)}.del{border:0;background:transparent;color:#c44;font-size:18px}
.empty{text-align:center;color:var(--muted);padding:25px}.ai{margin-top:18px;padding:16px;border-radius:20px;background:linear-gradient(135deg,#ececff,var(--card));}.ai b{display:block;margin-bottom:5px}.ai span{color:var(--muted);font-size:13px}
body.dark .ai{background:#20213a}dialog{border:0;border-radius:24px;padding:20px;width:min(92%,420px);background:var(--card);color:var(--text)}dialog::backdrop{background:#0008}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--text);font-size:16px;margin:8px 0 12px}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{padding:11px 15px;border:0;border-radius:12px}.primary{background:var(--accent);color:#fff}.fab{position:fixed;right:20px;bottom:22px;border:0;background:var(--accent);color:#fff;border-radius:18px;padding:16px 20px;font-size:16px;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header><h1>My Calendar</h1><button class="icon" id="theme">☾</button></header>
<div class="month"><button id="prev">‹</button><strong id="month"></strong><button id="next">›</button></div>
<section class="card"><div class="week" id="week"></div><div class="grid" id="grid"></div></section>
<div class="selected"><h2 id="selected"></h2><button class="add" onclick="openDialog()">＋ Event</button></div>
<div id="events"></div>
<div class="ai"><b>✨ AI Assistant</b><span>Coming next: type “Exam tomorrow at 10” and let My Calendar create the event.</span></div>
</div>
<button class="fab" onclick="openDialog()">＋ Add event</button>
<dialog id="dlg"><h2>Add event</h2><input id="title" placeholder="Event title"><input id="time" type="time"><div class="actions"><button onclick="dlg.close()">Cancel</button><button class="primary" onclick="addEvent()">Save</button></div></dialog>
<script>
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
let view=new Date(),selected=new Date(),events=JSON.parse(localStorage.getItem("myCalendarEvents")||"[]");
const $=id=>document.getElementById(id);function key(d){return d.toISOString().slice(0,10)}
function render(){ $("month").textContent=months[view.getMonth()]+" "+view.getFullYear();$("selected").textContent=selected.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});$("week").innerHTML=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div>${x}</div>`).join("");let first=new Date(view.getFullYear(),view.getMonth(),1).getDay(),days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate(),h="";for(let i=0;i<first;i++)h+="<span></span>";for(let d=1;d<=days;d++){let x=new Date(view.getFullYear(),view.getMonth(),d),k=key(x),sel=key(selected)==k,has=events.some(e=>e.date==k);h+=`<button class="day ${sel?"sel":""}" onclick="pick(${d})">${d}${has?'<i class="dot"></i>':''}</button>`}$("grid").innerHTML=h;renderEvents()}
function pick(d){selected=new Date(view.getFullYear(),view.getMonth(),d);render()}
function renderEvents(){let list=events.filter(e=>e.date==key(selected)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));$("events").innerHTML=list.length?list.map(e=>`<div class="event"><div class="circle">📅</div><main><b>${escapeHtml(e.title)}</b><small>${e.time||"All day"}</small></main><button class="del" onclick="removeEvent('${e.id}')">🗑</button></div>`).join(""):'<div class="empty">No events for this day.</div>'}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function openDialog(){$("title").value="";$("time").value="";$("dlg").showModal();setTimeout(()=>$("title").focus(),50)}
function addEvent(){let t=$("title").value.trim();if(!t)return;events.push({id:Date.now().toString(),title:t,time:$("time").value,date:key(selected)});localStorage.setItem("myCalendarEvents",JSON.stringify(events));$("dlg").close();render()}
function removeEvent(id){events=events.filter(e=>e.id!==id);localStorage.setItem("myCalendarEvents",JSON.stringify(events));render()}
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$("theme").onclick=()=>{document.body.classList.toggle("dark");$("theme").textContent=document.body.classList.contains("dark")?"☀":"☾";localStorage.setItem("dark",document.body.classList.contains("dark"))};if(localStorage.getItem("dark")=="true"){document.body.classList.add("dark");$("theme").textContent="☀"}render();
</script>
</body>
</html>
